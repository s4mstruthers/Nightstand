# Builds a universal DMG and attaches it to a GitHub release whenever a version tag (v1.2.3) is pushed.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test
        run: swift test
      - name: Build DMG
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh --universal --dmg
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are the summary line of each commit since the previous release, shown in the app's update sheet.
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range=${previous:+$previous..}$GITHUB_REF_NAME
          { echo "## What's new"; echo; git log --no-merges --format='- %s' "$range"; } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.dmg --title "Nightstand ${GITHUB_REF_NAME#v}" --notes-file notes.md
